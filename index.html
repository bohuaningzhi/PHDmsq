<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博食灵签 - 博士生专属食堂决策器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 1. 核心补丁：防止 Gemini SDK 因为找不到 process 对象而导致整个 App 崩溃
      window.process = window.process || { 
        env: { 
          API_KEY: "" // Netlify 会在运行时自动注入，这里确保对象存在
        } 
      };

      // 2. 错误监听：如果朋友打不开，控制台会显示具体原因
      window.addEventListener('error', function(e) {
        console.error('Runtime Error:', e.error);
      });
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
      body {
        font-family: 'Noto Serif SC', serif;
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
      }
      /* 初次加载的动画 */
      #first-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 100;
        transition: opacity 0.5s ease;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen overflow-x-hidden">
    <!-- 初次加载提示 -->
    <div id="first-loader">
        <div class="w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-slate-400 text-xs font-bold tracking-widest uppercase">正在同步导师指令...</p>
    </div>

    <div id="root"></div>

    <!-- 关键修复：必须显式引入入口文件，否则页面永远是白的 -->
    <script type="module" src="index.tsx"></script>

    <script>
      // 当 React 挂载后隐藏加载器
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('first-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
