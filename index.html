<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博食灵签 - 博士生专属食堂决策器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 1. 模拟环境对象，防止 SDK 崩溃
      window.process = window.process || { env: { API_KEY: "" } };
      
      // 2. 错误捕捉器：如果 JS 报错，直接在页面上显示（用于排查部署后的空白问题）
      window.onerror = function(msg, url, line, col, error) {
        const debugDiv = document.getElementById('debug-error');
        if (debugDiv) {
          debugDiv.style.display = 'block';
          debugDiv.innerHTML = `<strong>运行时错误:</strong> ${msg}<br><small>文件: ${url} (第${line}行)</small>`;
        }
        return false;
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
      body {
        font-family: 'Noto Serif SC', serif;
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
      }
      #debug-error {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px;
        z-index: 9999;
        font-size: 12px;
        border-bottom: 2px solid #ef4444;
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen overflow-x-hidden">
    <div id="debug-error"></div>
    <div id="root"></div>
    <!-- 关键：确保 index.tsx 路径正确 -->
    <script type="module" src="index.tsx"></script>
</body>
</html>
